[package]
name = "rusty-bot-messages"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.98"
description = "Provider-neutral LLM messages, multimodal history, streaming events, and prompt templates"
readme = "README.md"
documentation = "https://docs.rs/rusty-bot-messages"
keywords = ["llm", "messages", "multimodal", "streaming", "prompts"]
categories = ["data-structures"]
include = ["src/**", "README.md", "LICENSE", "Cargo.toml"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
