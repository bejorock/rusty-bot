[package]
name = "rusty-bot-engine-temporal"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license.workspace = true

[dependencies]
rusty-bot-session = { path = "../rusty-bot-session" }
uuid.workspace = true
async-trait.workspace = true
futures.workspace = true
rusty-bot-core = { path = "../rusty-bot-core" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
temporalio-macros = "=1.2.0"
temporalio-common = { version = "=1.2.0", default-features = false, features = ["vendored-protox"] }
temporalio-client = { version = "=1.2.0", default-features = false }
temporalio-workflow = { version = "=1.2.0", default-features = false }
temporalio-sdk = { version = "=1.2.0", default-features = false }

[dev-dependencies]
rusty-bot-postgres = { path = "../rusty-bot-postgres" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres"] }
